bot:
  automerge: true
build_platform:
  linux_aarch64: linux_64
  linux_ppc64le: linux_64
conda_build:
  error_overlinking: true
  pkg_format: '2'
conda_forge_output_validation: true
github:
  branch_name: main
  tooling_branch_name: main
provider:
  linux_aarch64: default
  osx_arm64: default
test: native_and_emulated
workflow_settings:
  build_workspace_dir:
  - os: win
    value: C:\bld
  free_disk_space:
  - os: linux
    value: quick
  pagefile_size:
  - os: linux
    value: 10
  tools_install_dir:
  - os: win
    value: C:\Miniforge
