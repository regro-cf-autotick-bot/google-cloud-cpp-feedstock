bot:
  automerge: true
build_platform:
  linux_ppc64le: linux_64
provider:
  linux_aarch64: default
  osx_arm64: default
conda_build:
  error_overlinking: true
  pkg_format: '2'
conda_forge_output_validation: true
github:
  branch_name: main
  tooling_branch_name: main
test: native_and_emulated
workflow_settings:
  build_workspace_dir:
    - value: C:\bld
      os: win
  free_disk_space:
    - value: quick
      os: linux
  pagefile_size:
    - value: 10
      os: linux
  tools_install_dir:
    - value: C:\Miniforge
      os: win
